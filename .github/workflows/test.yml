# Tests on a real Windows machine: Windows OCR, self-update script, and the built exe.
name: Test

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Handwriting model cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/calamo-model
          key: trocr-small-handwritten-v1

      - name: Handwriting reader speed, part by part
        env:
          CALAMO_MODEL_DIR: ${{ runner.temp }}/calamo-model
        run: python tools/reader_bench.py

      - name: Engine and updater tests
        env:
          CALAMO_MODEL_DIR: ${{ runner.temp }}/calamo-model
          CALAMO_GITHUB_TOKEN: ${{ github.token }}
        run: python tools/test_windows.py

      - name: A page of handwriting, 1.6.0 against this version (same computer)
        shell: pwsh
        env:
          CALAMO_MODEL_DIR: ${{ runner.temp }}/calamo-model
        run: |
          git fetch --depth 1 origin tag v1.6.0
          git worktree add "$env:RUNNER_TEMP/v160" v1.6.0
          python tools/page_bench.py --app "$env:RUNNER_TEMP/v160/app" --out "$env:RUNNER_TEMP/old.json"
          python tools/page_bench.py --out "$env:RUNNER_TEMP/new.json"
          python tools/page_bench.py --compare "$env:RUNNER_TEMP/old.json" "$env:RUNNER_TEMP/new.json"

      - name: PDF tools tests (forms, pages, PDF/A, signatures, export, many files)
        run: python tools/test_pdftools.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Interface test with a real browser and mouse
        shell: pwsh
        run: |
          npm install --no-save --prefix build/pw playwright@1.47.2
          node build/pw/node_modules/playwright/cli.js install chromium
          $env:PLAYWRIGHT = (Resolve-Path build/pw/node_modules/playwright).Path
          if (-not (Get-CimInstance Win32_SoundDevice)) { $env:NO_AUDIO = "1"; "Nessuna scheda audio su questa macchina" }
          $srv = Start-Process python -ArgumentList "tools/ui_harness.py", "build/uitest" -PassThru -NoNewWindow
          try { node tools/ui_test.js build/uitest; if ($LASTEXITCODE -ne 0) { throw "interface test failed" } }
          finally { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          $srv = Start-Process python -ArgumentList "tools/ui_harness.py", "build/uitest2" -PassThru -NoNewWindow
          try { node tools/ui_test_suite.js build/uitest2; if ($LASTEXITCODE -ne 0) { throw "interface test (tools) failed" } }
          finally { Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue }

      - name: Build CalamoPDF.exe
        run: pyinstaller --noconfirm --clean CalamoPDF.spec

      - name: Self-test of the built exe
        shell: pwsh
        env:
          CALAMO_MODEL_DIR: ${{ runner.temp }}/calamo-model
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          Start-Process -FilePath dist\CalamoPDF.exe -ArgumentList "--selftest", "samples\esempio.pdf", "`"$out`"" -Wait
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern '"ok": true' -Quiet)) { throw "self-test failed" }
          $out2 = Join-Path $env:RUNNER_TEMP "selftest2.json"
          Start-Process -FilePath dist\CalamoPDF-app\CalamoPDF.exe -ArgumentList "--selftest", "samples\esempio.pdf", "`"$out2`"" -Wait
          if (-not (Select-String -Path $out2 -Pattern '"ok": true' -Quiet)) { Get-Content $out2; throw "self-test of the folder build failed" }

      - name: Start-up time (portable one-file exe and installed folder)
        shell: pwsh
        run: |
          $ready = Join-Path $env:RUNNER_TEMP "ready.json"
          foreach ($exe in @("dist\CalamoPDF.exe", "dist\CalamoPDF-app\CalamoPDF.exe")) {
            $times = foreach ($k in 1..3) {
              Remove-Item $ready -ErrorAction SilentlyContinue
              (Measure-Command { Start-Process -FilePath $exe -ArgumentList "--startup-test", "`"$ready`"" -Wait }).TotalSeconds
            }
            if (-not (Test-Path $ready)) { throw "$exe did not start" }
            "{0}: {1}" -f $exe, (($times | ForEach-Object { "{0:N1}s" -f $_ }) -join ", ")
          }
