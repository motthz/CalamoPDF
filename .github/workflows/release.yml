# Builds CalamoPDF.exe and the installer and publishes them as a GitHub release.
# Publish a new version: bump VERSION in app/main.py, commit, then push a tag
#   git tag v1.1.0 && git push origin v1.1.0
# (or run this workflow by hand from the Actions tab: the tag is created from VERSION).
# The installed apps find the release and update themselves.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the app version (and check it matches the tag)
        shell: pwsh
        run: |
          $ver = (Select-String -Path app/main.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".TrimStart("v")
            if ($tag -ne $ver) { throw "Tag v$tag does not match VERSION $ver in app/main.py" }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests on Windows
        env:
          CALAMO_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/test_windows.py
          python tools/test_pdftools.py

      - name: Build CalamoPDF.exe
        run: |
          python tools/make_icon.py
          pyinstaller --noconfirm --clean CalamoPDF.spec

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      # nothing is published unless both builds (portable one-file exe and installed folder) pass
      - name: Self-test of the built exe (portable and installed folder)
        shell: pwsh
        run: |
          foreach ($exe in @("dist\CalamoPDF.exe", "dist\CalamoPDF-app\CalamoPDF.exe")) {
            $out = Join-Path $env:RUNNER_TEMP "selftest.json"
            Remove-Item $out -ErrorAction SilentlyContinue
            Start-Process -FilePath $exe -ArgumentList "--selftest", "samples\esempio.pdf", "`"$out`"" -Wait
            if (-not (Test-Path $out)) { throw "self-test of $exe wrote nothing" }
            Get-Content $out
            if (-not (Select-String -Path $out -Pattern '"ok": true' -Quiet)) { throw "self-test of $exe failed" }
            if (-not (Select-String -Path $out -Pattern '"readerSafe": true' -Quiet)) { throw "${exe}: the handwriting reader did not start in its own process" }
          }

      - name: Start-up check (portable and installed folder)
        shell: pwsh
        run: |
          $ready = Join-Path $env:RUNNER_TEMP "ready.json"
          foreach ($exe in @("dist\CalamoPDF.exe", "dist\CalamoPDF-app\CalamoPDF.exe")) {
            Remove-Item $ready -ErrorAction SilentlyContinue
            $t = (Measure-Command { Start-Process -FilePath $exe -ArgumentList "--startup-test", "`"$ready`"" -Wait }).TotalSeconds
            if (-not (Test-Path $ready)) { throw "$exe did not start" }
            $r = Get-Content $ready -Raw | ConvertFrom-Json
            if (-not $r.ready) { throw "$exe did not get ready" }
            if ($r.version -ne $env:APP_VERSION) { throw "$exe reports version $($r.version), expected $env:APP_VERSION" }
            "{0}: {1:N1}s" -f $exe, $t
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Calamo PDF Studio ${{ env.APP_VERSION }}
          body_path: docs/release-notes.md
          files: |
            dist/CalamoPDF.exe
            dist/CalamoPDF-Setup-${{ env.APP_VERSION }}.exe
